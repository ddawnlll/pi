      status: "confirmed"

gaps_and_risks:
  description: "Identified gaps that could explain why events never reach the TUI"
  gaps:
    - id: GAP-001
      description: "AutonomousExecutor may run in a different Node.js process than InteractiveMode"
      severity: critical
      evidence: >-
        The AutonomousExecutor is used in plan-execution contexts (workspace workers,
        gauntlet runners). These may fork separate processes. The interactive chat TUI
        runs in the main process. If they're different processes, the process-wide
        singleton emitter in process A has NO connection to process B.
      investigation: >-
        Check whether AutonomousExecutor.executeWorkspace() runs in-process or via
        child_process.fork() / worker_threads. If it's forked, the progress emitter
        events can never reach the TUI.
      resolution: >-
        If in-process: add logging to verify events fire and handlers execute.
        If separate process: need IPC bridge (worker.postMessage, process.send, or
        a file-watch-based approach where the TUI polls the artifact store for new
        files).

    - id: GAP-002
      description: "AccpArtifactStore may be instantiated with a different config rootDir"
      severity: medium
      evidence: >-
        saveCompiled() writes to reports/accp/{planId}/compiled/{reportId}.compiled.json.
        The TUI could watch this directory for new files as a fallback signal.
      investigation: >-
        Check the actual file paths being written. Run: find reports/accp/ -name "*.compiled.json" -newer <start-time>.
      resolution: >-
        If artifacts are written to the expected path, the file system is a valid
        side channel. The TUI can poll/watcher for evidence even without IPC.

    - id: GAP-003
      description: "Timing: emitter.set() may happen AFTER events fire"
      severity: medium
      evidence: >-
        InteractiveMode.init() runs during TUI startup. AutonomousExecutor starts
        after a plan is submitted. If init() runs first and set() is called, handlers
        are in place before any compilation happens. But if there's a race (e.g.,
        a plan is submitted during init), events may fire before set().
      investigation: >-
        Add console.log in onCompilationStarted handler. Check if it fires when
        running the test prompt.
      resolution: >-
        If handler fires but no output: the TUI rendering is the issue (Text
        component not added correctly, render loop not triggered). If handler
        never fires: the emitter is in a different process or set() hasn't been
        called yet.

    - id: GAP-004
      description: "Text components added to chatContainer may not render"
      severity: medium
      evidence: >-
        The handler code does:
          this.chatContainer.addChild(new Text(...))
          this.ui.requestRender()
        If chatContainer's render is not being called or if the Text component
        has incorrect padding/size, it may not appear.
      investigation: >-
        Add a console.log right before requestRender() in the handler. Check
        if it fires. If it does, the Text component is the issue.
      resolution: >-
        Use a Spacer(1) before adding Text, or wrap in a Container. Check that
        chatContainer.render(width) includes the new children.

final_status:
  verdict: HOLD
  confidence: high
  summary: >-
    The ACCP progress emitter → TUI pipeline has been wired in code
    (accp-progress-emitter.ts → accp-artifact-store.ts → interactive-mode.ts)
    but the events never render in the chat. The most likely root cause is
    GAP-001: AutonomousExecutor runs in a separate process from InteractiveMode,
    so the process-wide singleton emitter events in the worker process never
    reach the TUI process. Secondary possibilities: GAP-003 (timing race),
    GAP-004 (Text component rendering issue).

    This RIR research prompt asks for concrete investigation:

    1. Confirm whether AutonomousExecutor.executeWorkspace() forks a child process
       or runs in-process. Check for child_process.fork(), worker_threads, or
       AgentSessionRuntime usage.

    2. Add a console.log in the InteractiveMode.init() progress emitter handler
       and check if it fires during an ACCP workflow.

    3. Check the artifact store filesystem to confirm artifacts are being written.

    4. If GAP-001 is confirmed (separate process), design an IPC bridge or
       filesystem-watch approach.

  blockers:
    - "Unknown whether AutonomousExecutor and InteractiveMode share the same process"
    - "No console.log in the emitter handler path to confirm execution"
  next_step: >-
    Investigate GAP-001 first: trace the AutonomousExecutor process model.
    Then add console.log to verify handler execution. Based on results,
    determine whether IPC bridge or filesystem-watch is needed.

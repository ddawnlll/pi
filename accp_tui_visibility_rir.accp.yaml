purpose:
  summary: >-
    Research why ACCP compile/gate/artifact events emitted through the
    process-wide progress emitter never reach the interactive-mode chat TUI.
    The AutonomousExecutor calls compileAccpSource() and AccpArtifactStore
    save methods which emit events. The InteractiveMode calls
    getAccpProgressEmitter().set(...) in its init() method to register
    handlers. The events should appear as inline chat messages, but they
    never render.
  examples_remain_examples: false
  production_generation_uses_this_file: false


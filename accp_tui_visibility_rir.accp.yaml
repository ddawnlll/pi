domain_map:
  description: "Data flow from ACCP execution to TUI rendering"
  components:
    - name: "AutonomousExecutor (process A)"
      description: >-
        Runs compileAccpSource() → AccpArtifactStore.saveCompiled() →
        AccpArtifactStore.saveGateVerdict(). Each call hits the process-wide
        getAccpProgressEmitter() singleton. Events are emitted but the
        question is: is this the SAME process as InteractiveMode?
      question: "Is AutonomousExecutor running in the same Node.js process as the InteractiveMode chat TUI?"
      symptoms: "If separate process, events fire in process A but process B never sees them because the singleton is per-process."

    - name: "InteractiveMode (process B?)"
      description: >-
        Calls getAccpProgressEmitter().set(...) in init() to register
        handlers that write to this.chatContainer. This runs in the TUI
        chat process.
      question: "Does init() run BEFORE or AFTER AutonomousExecutor emits events?"
      symptoms: "If init() hasn't run yet when events fire, the handlers map is empty and events silently drop."

    - name: "AccpProgressEmitter (singleton)"
      description: >-
        A process-wide singleton. getAccpProgressEmitter() returns the
        same instance. set(handlers) replaces ALL handlers. If called
        twice, the second call overwrites the first.
      question: "Is there a race between AgentSession.set and InteractiveMode.set?"
      symptoms: "AgentSession constructor calls attachAccpProgressEmitter(), then InteractiveMode.init() calls getAccpProgressEmitter().set(...). The second call overwrites the first. This is intentional but may cause events that fire between the two calls to be lost."

    - name: "AcpArtifactStore"
      description: >-
        Calls getAccpProgressEmitter().emitCompilationCompleted() and
        emitArtifactWritten() synchronously. No async delay.
      question: "Is the emitter instantiated before the store methods are called?"
      symptoms: "The emitter singleton is lazy-instantiated on first getAccpProgressEmitter() call. If store methods are called before the first get(), the emitter exists but has empty handlers."

contracts_and_schemas:
  description: "Key contracts governing event flow"
  contracts:

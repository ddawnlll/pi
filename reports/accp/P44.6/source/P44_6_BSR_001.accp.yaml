    additional_evidence: "processWriteResult logs failures but does not route to HIR"
    file_ref2: packages/coding-agent/src/core/write-gate.ts
    lines2: 345-400

recommended_blocks:
  - block: "Required input missing must produce HIR before any write"
    blocks_failure_class: FC-MISSING-INPUT
    implemented_by: ArtifactGenerationGate.InputManifestBuilder

  - block: "Absolute path or path outside repo root must reject with HIR"
    blocks_failure_class: FC-PATH-MISMATCH
    implemented_by: RepoPathResolver

  - block: "Large artifact direct write is forbidden above threshold; smart_write required"
    blocks_failure_class: FC-LARGE-WRITE-TRUNCATION
    implemented_by: SafeArtifactWriter with byte count comparison

  - block: "Shell-based fallback writes forbidden; route to HIR instead"
    blocks_failure_class: FC-PYTHON-C-HUGE-LITERAL
    implemented_by: ArtifactFailureRouter

  - block: "Generated JSON/YAML must parse before success; failure routes to HIR"
    blocks_failure_class: FC-INVALID-JSON-YAML
    implemented_by: ArtifactValidationRunner

  - block: "Schema compatibility gate before write; extra fields go to companion artifacts"
    blocks_failure_class: FC-SCHEMA-ADDITIONAL-PROPERTIES
    implemented_by: ArtifactGenerationGate + ArtifactDecompositionPlanner

  - block: "All write/input/parse/schema failures must route to HIR"
    blocks_failure_class: FC-SILENT-CONTINUATION
    implemented_by: ArtifactFailureRouter

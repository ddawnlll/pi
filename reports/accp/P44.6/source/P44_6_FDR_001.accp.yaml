acceptance_criteria:
  - id: AC-P446-001
    text: "Required input missing blocks artifact generation and produces manifest/HIR."
    verification: "Unit test: InputManifestBuilder with missing file returns failed manifest with file list."
  - id: AC-P446-002
    text: "Repo root is resolved dynamically; absolute path assumptions are rejected."
    verification: "Unit test: RepoPathResolver with absolute path outside repo returns error."
  - id: AC-P446-003
    text: "Large artifact direct write is forbidden above threshold."
    verification: "Unit test: smart_write with content above threshold but no atomic strategy returns blocked."
  - id: AC-P446-004
    text: "smart_write uses temp file, byte count, parse/schema validation, readback, and atomic rename."
    verification: "Integration test: Write generated JSON, verify temp file created, byte count matches, parse passes, hash matches, final file in place."
  - id: AC-P446-005
    text: "smart_edit refuses missing anchors/ranges and validates temp copy before final replace."
    verification: "Unit test: smart_edit with non-matching oldText returns error. Integration test: smart_edit validates temp copy before replace."
  - id: AC-P446-006
    text: "JSON/YAML outputs must parse successfully before success is reported."
    verification: "Unit test: ArtifactValidationRunner with invalid JSON returns error. With valid JSON returns success."
  - id: AC-P446-007
    text: "Schema validation runs when schema is available; failure blocks final artifact success."
    verification: "Integration test: Write PlanSpec JSON with extra field, schema validation rejects, success not reported."
  - id: AC-P446-008
    text: "Truncation detection prevents success and forbids retrying with the same write method."
    verification: "Unit test: SafeArtifactWriter with truncated write (simulated byte count mismatch) returns failure and blocks retry."
  - id: AC-P446-009
    text: "Multi-artifact tasks are decomposed into staged generation."
    verification: "Integration test: ArtifactDecompositionPlanner splits 3-artifact task into 3 staged writes."
  - id: AC-P446-010
    text: "If schema additionalProperties=false, extra design fields go to companion artifacts, not the schema-bound artifact."
    verification: "Unit test: ArtifactDecompositionPlanner with schema-bound fields returns separate companion artifact paths."
  - id: AC-P446-011
    text: "The system does not continue after required input, write, parse, or schema failure unless routed to explicit repair/HIR."
    verification: "Integration test: Trigger each failure class, verify HIR is produced and agent does not continue to next operation."
  - id: AC-P446-012
    text: "No generic research-worker framework is introduced."
    verification: "Code review: no packages/coding-agent/src/core/research-worker/ or equivalent directory created."

validation_strategy: |
  1. Unit tests for each module in isolation (mock file system)
  2. Integration tests for smart_write and smart_edit with temp files
  3. Schema validation tests using both Zod and JSON Schema paths
  4. Gauntlet tests (P44.6.05) for end-to-end scenarios:
     - Large PlanSpec JSON generation with full validation
     - ACCP YAML generation with schema validation
     - Missing input file scenario
     - Path mismatch scenario
     - Truncation simulation scenario
     - Malformed JSON output scenario
     - Schema additionalProperties rejection scenario
     - Multi-artifact decomposition scenario
  5. Failure routing tests: each failure class routes to HIR

next_route: "FCR — Contract Freeze Report"

next_route_if_success: "FCR → PlanSpec generation"
next_route_if_blocked: "HIR"

missing_plan_inputs:
  - id: MI001
    title: "PlanSpec v5 Alpha2 JSON Schema runtime validator"
    description: "No AJV or JSON Schema validator exists in packages/. The alpha2 JSON Schema is documentation-only."
  - id: MI002
    title: "P44.6 dedicated workspace or module directory"
    description: "No packages/coding-agent/src/core/p44-6/ or similar directory exists. All modules must be created fresh."
  - id: MI003
    title: "Pre-existing smart_write or smart_edit tool"
    description: "No smart_write or smart_edit tool exists. The write tool is the generic write, the edit tool is the generic edit. Both lack schema validation, truncation detection, input manifest preflight, and HIR routing."
  - id: MI004
    title: "P44.6 PlanSpec or workspace graph"
    description: "No P44.6 plan exists yet. The workspace graph must be designed and produced as a PlanSpec or companion artifact."

planspec_schema_constraints:
  alpha2_json_schema:
    additionalProperties_false: true
    required_fields:
      - $schema, planSpecVersion, kind, metadata, compatibility, intent, authority
      - enforcementRegistry, security, commands, locking, brief, waves, workspaces
      - validation, evidence, reports, p45Bridge
    extra_fields_policy: rejected (additionalProperties: false at root)
    notes: |
      Any design field not in the alpha2 schema must go to a companion artifact.
      The alpha2 schema is the contractual schema for PlanSpec files.
      Companion artifacts are not schema-bound and can contain design rationale.

  rc1_zod_schema:
    additionalProperties_false: true (via strictObj)
    required_fields:
      - accpVersion, planspecVersion (literal "5.0.0"), taskId, taskName, executionClass
      - workspaceGroup, allowProductionCodeChanges, allowTestCodeChanges, allowReportFiles
      - requireRepoInspectionFirst, requireValidationEvidence, requireRollbackPlan
      - requireFinalAccpReport, authority, waves, workspaces, templates, validationCases
    notes: |
      RC1 Zod schema is used by the runtime compiler (compilePlanSpecAlpha2).
      Alpha2 JSON Schema is the canonical spec schema.
      These are different schemas with different field sets.

accp_report_constraints:
  format: ACCP-YAML with accp_version: "2.0.0"
  authority_section:
    reports_are_evidence_only: true
    route_signals_are_advisory: true
  output_paths:
    allowed: reports/accp/P44.6/source/ and reports/p44-6/research/
    policy: read-only research; no source code mutation

p44_6_planning_assumptions:
  - assumption: "P44.6 must not modify source files in packages/"
    confidence: high
    evidence: "The ACCP task specifies mutation_allowed: false and explicitly says 'No implementation is allowed in this research pass.'"
  - assumption: "P44.6 can reuse SmartMutationEngine primitives (atomicWriteFile, validateFileContent, checkWriteSet)"
    confidence: high
    evidence: "These exist at packages/coding-agent/src/core/mutation/ and are already integrated with the write tool."
  - assumption: "P44.6 must add schema validation to the write path"
    confidence: high
    evidence: "No schema validation exists in the write/edit pipeline despite PlanSpec schemas being available (RIR G003)."
  - assumption: "P44.6 must add HIR routing for write/input failures"
    confidence: high
    evidence: "No HIR routing exists in write tool, WriteGate, or SmartMutationEngine (RIR G004)."
  - assumption: "P44.6 must add input manifest preflight"
    confidence: high
    evidence: "No input manifest requirement exists before artifact generation (RIR G001)."
  - assumption: "P44.6 should produce a PlanSpec v5 Alpha2 or RC1 plan"
    confidence: medium
    evidence: "Previous P44's produced PlanSpec artifacts (P44.5 has a full alpha2 compiled plan). P44.6 should follow the same pattern."

schema_compatible_vs_companion_artifact_separation:
  policy: "Design fields not in PlanSpec alpha2 schema must be placed in companion artifacts"
  companion_artifact_path: "reports/p44-6/research/"
  companion_format: "Markdown or JSON (not schema-bound)"
  schema_bound_artifact_path: "reports/accp/P44.6/source/"
  schema_bound_format: "ACCP-YAML (for reports) or PlanSpec JSON (for plan)"
  notes: |
    The alpha2 schema has additionalProperties: false at root level.
    Any workspace_graph_recommendation, design_rationale, or non-goal documentation
    that does not map to a PlanSpec field must go to companion artifacts.
    ACCP-YAML reports in source/ are schema-bound to ACCP v2.0.0 format.


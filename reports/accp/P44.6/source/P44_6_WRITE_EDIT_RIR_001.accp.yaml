        - 4c.ii  Check line drop ratio (>40% blocked)
        - 4c.iii Create backup (atomic-file-writer.ts L73-86)
        - 4c.iv  validateFileContent (parser-validation.ts L157-218) with validationPolicy
        - 4c.v   atomicWriteFile -> temp file rename readback hash (atomic-file-writer.ts L114-144)
        - 4c.vi  If parser failed and rollbackOnParserFailure: restore backup return blocked
        - 4c.vii Return ok true/false
        - 5. If mutationResult.ok === false: return isError true with blockReason

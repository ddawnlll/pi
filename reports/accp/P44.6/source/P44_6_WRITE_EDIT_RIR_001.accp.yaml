    - Do not create second parser-validation implementation reuse validateFileContent
    - Do not create second path-normalization or WriteSet implementation reuse checkWriteSet
    - Do not create second backup/restore system reuse createBackup/restoreBackup
    - Do not create second fuzzy-find implementation reuse fuzzyFindText from edit-diff.ts

failure_taxonomy:
  write_failure_classes:
    - class: Missing input file
      detection: Read tool returns ENOENT
      current_handling: No preflight check agent may continue silently
      recommended_block: InputManifestBuilder preflight
    - class: Path outside repo
      detection: normalizeRepoPath returns null
      current_handling: SME path blocks direct path writes anywhere
      recommended_block: RepoPathResolver before all write paths
    - class: Write truncated on disk
      detection: Byte comparison expected vs actual
      current_handling: NOT DETECTED atomicWriteFile hash only TruncationDetector is text heuristic
      recommended_block: SafeArtifactWriter with Buffer.byteLength comparison
    - class: Malformed JSON/YAML output
      detection: JSON.parse or js-yaml.parse fails
      current_handling: SME with best_effort default Direct path no validation
      recommended_block: ArtifactValidationRunner with required policy
    - class: Schema incompatibility
      detection: Zod or JSON Schema validation rejects
      current_handling: NOT CHECKED during write post-hoc only
      recommended_block: Schema check before write success
  edit_failure_classes:
    - class: oldText not found
      detection: fuzzyFindText returns found false
      current_handling: SME editWithRecovery Direct path error + recovery packet
      recommended_block: smart_edit refuse missing anchor route to HIR
    - class: Ambiguous oldText
      detection: indexOf finds second occurrence
      current_handling: Block with ambiguous_oldText
      recommended_block: Block is correct maintain this behavior
    - class: Edit produces invalid JSON/YAML
      detection: Post-edit parse validation fails
      current_handling: SME rollback Direct path no validation
      recommended_block: smart_edit validate temp copy before final replace
    - class: Edit produces schema-invalid content
      detection: Schema validation of edited content fails
      current_handling: NOT CHECKED in any edit path
      recommended_block: smart_edit run schema validation on temp copy

smart_write_design_recommendation:
  recommended: true
  core_invariant: No verified write no artifact
  architectural_decision: New SafeArtifactWriter module
  reason: smart_write must be artifact-specific schema-aware byte-checking and failure-routing
  must_reuse:
    - atomicWriteFile from atomic-file-writer.ts
    - validateFileContent from parser-validation.ts
    - checkWriteSet from write-set-guard.ts
    - createBackup from atomic-file-writer.ts
    - computeFileHash from atomic-file-writer.ts
    - getFileByteCount from atomic-file-writer.ts
  must_add:
    - Pre-compute expected Buffer.byteLength before write
    - Post-write stat + compare byte count against expected
    - Schema validation integration (Zod or AJV)
    - Input manifest preflight check
    - HIR routing on any failure
    - Companion artifact separation for schema-incompatible fields
  threshold_for_direct_write_forbidden:
    value: 10240
    unit: bytes

smart_edit_design_recommendation:
  recommended: true
  architectural_decision: New SafeArtifactEditor module
  reason: Validation-centric editor reusing edit-diff.ts matching not edit.ts tool UI
  mvp_modes:
    - mode: old_text_replace
      description: Exact oldText/newText replacement with temp-copy validation parse+schema HIR routing
    - mode: anchor_insert_before
      description: Insert before unique anchor with temp-copy validation
    - mode: anchor_insert_after
      description: Insert after unique anchor with temp-copy validation
  future_modes:
    - mode: markdown_section_replace
      phase: Post-MVP
    - mode: json_keypath_set
      phase: Post-MVP
    - mode: yaml_keypath_set
      phase: Post-MVP
  excluded_modes:
    - universal_ast_edit
    - range_based_edit
    - multi_agent_edit_planner
    - full_code_refactor_engine
    - every_language_parser_integration

token_reduction_strategy:
  problem: Model reads 50KB PlanSpec then writes 50KB back = 25K tokens per round trip
  smart_edit_solution: Tool reads internally model sends 200-500 bytes path+mode+oldText+newText
  reduction_estimate: 99.6% token reduction for large artifact edits
  additional_benefits:
    - Reduced failure surface
    - Reduced latency
    - Schema validation at edit time
    - Deterministic matching


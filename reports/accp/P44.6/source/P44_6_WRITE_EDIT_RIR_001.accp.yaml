      condition: options.writeGate AND options.smartMutationEngine both provided
      steps:
        - 1. resolveToCwd(path cwd) -> absolutePath (path-utils.ts L54-60)
        - 2. relative(cwd absolutePath) -> relPath
        - 3. WriteGate.check(absolutePath relPath Buffer.byteLength utf-8 undefined lineCount) L220-226

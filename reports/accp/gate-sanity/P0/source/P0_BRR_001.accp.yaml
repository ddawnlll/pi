blocking_observations:
  - id: OBS-001
    severity: high
    description: >
      The audit harness cannot observe the WriteGate v2 tool path while
      running outside an agent context. NEG-004 (forbidden mutation) cannot
      be exercised end-to-end by the shell audit harness. The kernel itself
      has the policy, but the audit harness does not mount the tool.
    recommendation: "Mount WriteGate v2 in the audit harness or run NEG-004 from a worker adapter so the gate can be observed end-to-end."
  - id: OBS-002
    severity: medium
    description: >
      The audit harness cannot capture live TUI evidence for NEG-010.
      Terminal capture, TUI smoke, or runtime trace are not produced
      by a shell harness.
    recommendation: "Mount a TUI smoke harness (e.g. tmux + capture-pane) or run NEG-010 from a worker adapter."
  - id: OBS-003
    severity: info
    description: >
      The accp-compiler (P49.x deliverable) does not currently emit
      policy-derived diagnostics for missing-evidence, PRR-with-blockers,
      raw-yaml-authority, stale-verdict, or dead-code promotion caps.
      Those policies are encoded in planspecs and evaluated by the
      engine, not by the compiler. The audit harness hand-rolls the
      diagnostics for the negative controls so that the gate-verdict
      machine-readable evidence is preserved.
    recommendation: "Consider extending the compiler to emit ACCP_AUTHORITY-family diagnostics for the policy checks listed above."


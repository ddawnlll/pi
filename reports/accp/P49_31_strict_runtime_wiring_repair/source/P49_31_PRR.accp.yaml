    P50 is explicitly blocked by hard stop HS-010 ("Any P50 implementation or promotion is attempted").
    The P49.31 phase repairs the wiring chain identified in the culprit audit:
    CompletionGate STAGE_ORDER, runAccpGateStage registration, kernel ACCP predicate,

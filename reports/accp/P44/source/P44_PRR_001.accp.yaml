open_risks:
  - id: "RISK-001"
    severity: "P0"
    title: "AutoCommit silently drops files outside canEdit scope"
    description: >
      AutoCommit.commit() in auto-commit.ts filters changed files against
      workspace canEdit patterns. Files outside canEdit are silently dropped.
      If the filtered list is empty, the commit returns "No files to commit"
      and the failure is swallowed as a console.warn. Workspaces remain
      COMPLETE regardless of commit success.
    mitigation: "Requires FPR to fix commit pipeline"
    owner: "infrastructure"

  - id: "RISK-002"
    severity: "P0"
    title: "Dashboard reports complete without verifying git commits"
    description: >
      Dashboard/read-model reads plan-summary.json and journal events but
      never checks whether git commits were actually created. A workspace
      can be COMPLETE in runtime but have zero files committed.
    mitigation: "Requires FPR to add commit verification to completion status"
    owner: "infrastructure"

  - id: "RISK-003"
    severity: "P2"
    title: "Pre-existing test failures in 3 test files"
    description: >
      11 test failures exist in acceptance-criteria.test.ts,
      evidence-ledger.test.ts, and p44_01.test.ts. These predate the
      recovery work and are unrelated to P44 implementation completeness.
    mitigation: "Separate fix needed; not a P44 implementation blocker"
    owner: "development"

  - id: "RISK-004"
    severity: "P2"
    title: "write-set-guard.ts at different path than PlanSpec expects"
    description: >
      PlanSpec expects write-set-guard.ts at packages/coding-agent/src/core/write-set-guard.ts
      but it was created at packages/coding-agent/src/core/mutation/write-set-guard.ts.
      The mutation/index.ts re-exports it correctly. Path is functionally
      correct but differs from PlanSpec declaration.
    mitigation: "Documented; no functional impact"

  - id: "RISK-005"
    severity: "P3"
    title: "P45 bridge workspaces not in P44 primary scope"
    description: >
      P45.B1, P45.B2, P45.B3 are listed in the PlanSpec as P44 tasks but
      are P45 bridge workspaces. P45.B1 was not explicitly committed.
      These are outside P44 primary scope and were not investigated.
    mitigation: "Documented; P45 bridge completion is a separate concern"


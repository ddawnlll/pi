    - "git status --porcelain"
    - "git ls-files"
    - "git log --follow"
    - "git reflog --date=iso --all"
    - "git stash list"
    - "git worktree list --porcelain"
    - "git branch --all --verbose --no-abbrev"
    - "find and ls for artifact discovery"
    - "rg for source code pattern matching"
  data_sources_read:
    - ".pi/executions/6f51f0e7-1aa1-431d-b2e0-1edd3277e59e/plan-summary.json"
    - ".pi/executions/6f51f0e7-1aa1-431d-b2e0-1edd3277e59e/workspaces/P44.*/audit.ndjson"
    - ".pi/executions/6f51f0e7-1aa1-431d-b2e0-1edd3277e59e/workspaces/P44.*/raw.log"
    - ".pi/workspaces/P44.*/packet.json"
    - ".pi/workspaces/P44.*/report.md"
    - ".pi/workspaces/P44.*/execution-*.log"
    - "packages/coding-agent/src/core/auto-commit.ts (full read)"
    - "packages/coding-agent/src/core/workspace-commit-gate.ts (full read)"
    - "packages/coding-agent/src/core/autonomous-executor.ts (lines 2630-2750)"
    - "packages/execution-service/src/query-handler.ts (lines 415-478, 843-943)"

bug_findings:
  - id: "BG001"
    severity: "P0"
    title: "6 P44 workspaces have no dedicated git commit"
    description: >
      Of 15 P44 workspaces, 6 (P44.00, P44.01, P44.02, P44.03, P44.06, P44.11)
      have no workspace-specific git commit. The auto-commit flow ran but
      resulted in zero staged files for these workspaces. The workspaces
      are marked COMPLETE in runtime state but their output files either
      remain untracked or were partially committed via unrelated catch-all
      cleanup commits.
    evidence:
      - "git log --oneline --all --grep='complete workspace P44.00' returns NO results"
      - "git log --oneline --all --grep='complete workspace P44.01' returns NO results"
      - "git log --oneline --all --grep='complete workspace P44.02' returns NO results"
      - "git log --oneline --all --grep='complete workspace P44.03' returns NO results"
      - "git log --oneline --all --grep='complete workspace P44.06' returns NO results"
      - "git log --oneline --all --grep='complete workspace P44.11' returns NO results"
      - "9 other P44 workspaces DO have dedicated commits (P44.04, P44.05, P44.07, P44.08, P44.09, P44.10, P44.12, P44.13, P44.WG)"
    affected_components:
      - "packages/coding-agent/src/core/auto-commit.ts"
      - "packages/coding-agent/src/core/autonomous-executor.ts"
    file_evidence:
      - path: ".pi/workspaces/P44.00/report.md"
        status: "complete"
      - path: ".pi/workspaces/P44.01/report.md"
        status: "complete"
      - path: ".pi/workspaces/P44.02/report.md"
        status: "complete"
      - path: ".pi/workspaces/P44.03/report.md"
        status: "complete"
      - path: ".pi/workspaces/P44.06/report.md"
        status: "complete"
      - path: ".pi/workspaces/P44.11/report.md"
        status: "complete"

  - id: "BG002"
    severity: "P1"
    title: "18+ untracked P44 files exist on disk but were never committed"
    description: >
      Git status shows 16+ untracked items including entire directories
      (docs/pi/p44/, packages/coding-agent/test/gauntlet/) and individual
      files in packages/coding-agent/src/core/completion/ and test/
      directories. These represent verified workspaces whose output files
      never made it into a git commit.
    evidence:
      - "git status --porcelain shows 16+ untracked items (excluding .pi/ and node_modules/)"
      - "docs/pi/p44/ directory: 4 untracked files (fake-complete-rca.md, completion-path-diagram.md, traceability-schema.md, evidence-ledger.md)"
      - "packages/coding-agent/src/core/completion/: 6 untracked files (completion-gate-v2.ts, completion-gate-result.ts, completion-gate-adapter.ts, index.ts, p45-bridge-exporter.ts, traceability-schema.ts)"
      - "packages/coding-agent/test/completion/: 3 untracked files (acceptance-criteria.test.ts, completion-gate-v2.test.ts, evidence-ledger.test.ts)"
      - "packages/coding-agent/test/gauntlet/: entire untracked directory"
    affected_components:
      - "packages/coding-agent/src/core/auto-commit.ts"
      - "packages/coding-agent/src/core/autonomous-executor.ts"

  - id: "BG003"
    severity: "P1"
    title: "3 files claimed in plan-summary do not exist on disk"
    description: >
      The plan-summary.json's changedFiles list includes 3 files that do
      not exist on disk and have no git history:
      - packages/coding-agent/test/completion/worker-report-contract.test.ts
      - docs/pi/p44/worker-report-contract.md
      - packages/coding-agent/src/core/write-set-guard.ts
      These workspace claims are unverifiable. The workspace may have
      hallucinated or failed to write these files.
    evidence:
      - "test -f packages/coding-agent/test/completion/worker-report-contract.test.ts => NO"
      - "test -f docs/pi/p44/worker-report-contract.md => NO"
      - "test -f packages/coding-agent/src/core/write-set-guard.ts => NO"
      - "git ls-files for all 3 paths returns empty"
      - "Plan-summary.json changedFiles list includes all 3 paths"
    affected_components:
      - "packages/coding-agent/src/core/workspace-agent-executor.ts"
      - "Agent workspace output integrity"

  - id: "BG004"
    severity: "P0"
    title: "Dashboard completion status is runtime-only; does not verify git commits"
    description: >
      The dashboard/read-model computes completion status from:
      1. plan-summary.json `passed` field (set when all workspaces reach terminal state)
      2. Journal events (workspace_completed, plan_completed, etc.)
      3. Workspace state (stage: complete)
      It does NOT check whether git commits were actually created. The
      plan-summary.json explicitly claims "All work was committed across
      18+ commits" but this is incorrect — only 9 workspace-specific
      commits exist, plus some catch-all commits. The dashboard shows
      "complete" based on runtime state alone.
    evidence:
      - "plan-summary.json: passed=true, summary claims all work committed"
      - "Only 9/15 P44 workspaces have dedicated commits"
      - "query-handler.ts extractCompletionStatusFromEvents() only checks terminal event types"
      - "query-handler.ts createExecutionReadModel() getPlanSummary() uses plan-summary.json or plan_started/completed events"
    affected_components:
      - "packages/execution-service/src/query-handler.ts"
      - "packages/web-server/src/read-model-routes.ts"

  - id: "BG005"
    severity: "P0"
    title: "AutoCommit silently skips files when canEdit patterns don't match git status paths"
    description: >
      The AutoCommit.validateCommit() method (auto-commit.ts lines 77-149)
      filters changed files against workspace canEdit patterns. If an agent
      writes files outside its declared canEdit pattern set, those files are
      silently excluded from the commit. The commit then either has no files
      to commit (skipped with 'No files to commit') or commits only a subset.
      This explains why P44.03's completion-gate-v2.ts (not in canEdit for
      any workspace that created it) remains untracked — it was written by
      an agent but never matched by any workspace's canEdit filter.
    evidence:
      - "auto-commit.ts line 128-136: Only files matching canEdit patterns are committed"
      - "auto-commit.ts line 174-179: Returns success=false with 'No files to commit' when filtered list is empty"
      - "autonomous-executor.ts line 1664-1671: Commit failure is caught and logged as console.warn — non-fatal"
      - "P44.03's packet.json: canEdit includes 6 paths but completion-gate-v2.ts and other files are not in canEdit"
    affected_components:
      - "packages/coding-agent/src/core/auto-commit.ts"
      - "packages/coding-agent/src/core/autonomous-executor.ts"

  - id: "BG006"
    severity: "P2"
    title: "Commit failures are non-fatal and only logged as warnings"
    description: >
      In autonomous-executor.ts line 1664-1671, the commitWorkspace() call
      is wrapped in a try/catch. Any failure (including validation failure
      like 'No files to commit') is caught, logged as console.warn, and
      silently swallowed. The workspace remains marked COMPLETE. There is
      no retry mechanism and no escalation to the plan summary/status.
    evidence:
      - "autonomous-executor.ts lines 1664-1671: try/catch with console.warn on failure"
      - "auto-commit.ts line 167: Returns success=false on validation failure"
      - "No retry mechanism for failed commits"
    affected_components:
      - "packages/coding-agent/src/core/autonomous-executor.ts"

  - id: "BG007"
    severity: "P2"
    title: "plan-summary.json claims all work committed but is self-reported without verification"
    description: >
      The plan-summary.json summary field states 'All work was committed
      across 18+ commits' but this claim is written by the execution
      framework without actually verifying that commits succeeded. The
      summary text is part of the plan execution output, not a verified
      post-condition. This creates a false positive in the dashboard.
    evidence:
      - "plan-summary.json summary: 'No uncommitted changes remain; all work was committed across 18+ commits'"
      - "Actual committed workspace count: 9/15 P44 workspaces + 2 P45 bridge workspaces + some catch-all commits ≠ 18 workspace-specific commits"
      - "16+ untracked P44 files exist on disk contradicting this claim"
    affected_components:
      - "Plan execution summary generation"
      - "Dashboard read-model"

  - id: "BG008"
    severity: "P2"
    title: "workspace-agent-executor writes that files were created but git trace shows no evidence"
    description: >
      The workspace report for P44.06 claims that files
      worker-report-contract.test.ts and worker-report-contract.md were
      created, but these files do not exist on disk and have no git history.
      This indicates either a hallucinated claim by the agent or a file
      that was created and then lost during workspace cleanup.
    evidence:
      - "P44.06 report.md lists worker-report-contract.test.ts as created"
      - "File does not exist on disk"
      - "File has no git history"
      - "Only remaining tracked evidence is worker-report-contract.ts (source) and worker-echo-extraction.test.ts"
    affected_components:
      - "packages/coding-agent/src/core/workspace-agent-executor.ts"
      - "Agent output integrity verification"

  - id: "BG009"
    severity: "P3"
    title: "P44.00, P44.01, P44.02 execution timestamps show suspicious clustering"
    description: >
      The execution-level journal events for P44.00, P44.01, and P44.02
      all show completion at 22:30:10.412-416Z, within 4 milliseconds of
      each other. This is physically impossible for sequential workspace
      execution unless these workspaces were either:
      (a) executed in parallel with identical durations, or
      (b) completed via a bulk-mark-complete operation rather than actual
          agent execution, or
      (c) the journal timestamps are unreliable.
    evidence:
      - ".pi/executions/.../workspaces/P44.00/raw.log: 22:30:10.412Z"
      - ".pi/executions/.../workspaces/P44.01/raw.log: 22:30:10.415Z"
      - ".pi/executions/.../workspaces/P44.02/raw.log: 22:30:10.416Z"
      - "All three completed within 4ms"
    affected_components:
      - "Execution journaling"
      - "Plan state sync"

  - id: "BG010"
    severity: "P2"
    title: "Git reflog shows multiple 'reset: moving to HEAD' operations during P44 execution"
    description: >
      The git reflog shows 4 instances of 'reset: moving to HEAD' during
      the P44 execution window (2026-06-10T01:38-01:45). These resets
      occurred immediately after P44 commits, suggesting the auto-commit
      or execution pipeline may be running git reset operations that could
      discard staged or unstaged changes.
    evidence:
      - "reflog: '52764b08 HEAD@{01:45:06}: reset: moving to HEAD'"
      - "reflog: '13649aee HEAD@{01:43:01}: reset: moving to HEAD'"
      - "reflog: '2802c8a6 HEAD@{01:38:32}: reset: moving to HEAD'"
      - "reflog: '4eb17d8c HEAD@{00:53:52}: reset: moving to HEAD'"
    affected_components:
      - "Git runner"
      - "Auto-commit pipeline"


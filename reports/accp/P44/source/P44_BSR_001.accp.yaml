bug_search_scope:
  description: >
    Audit P44 plan completion integrity. Determine whether P44 is truly
    100% complete, compare dashboard completion status against git history
    and on-disk workspace artifacts, identify missing commits and artifacts,
    trace the root cause of commit failures, and assess whether the
    completion-status mismatch is a runtime bug, dashboard/read-model bug,
    auto-commit bug, cleanup/review bug, worktree/integration bug, or
    plan-state accounting bug.
  scope_limits:
    - Do not modify source code
    - Do not fix any issues
    - Read-only investigation with report artifact write permission
  investigation_domains:
    - ".pi/executions/6f51f0e7-1aa1-431d-b2e0-1edd3277e59e/"
    - ".pi/workspaces/P44.*/"
    - ".pi/sessions/P44.*/"
    - "packages/coding-agent/src/core/auto-commit.ts"
    - "packages/coding-agent/src/core/autonomous-executor.ts"
    - "packages/coding-agent/src/core/workspace-commit-gate.ts"
    - "packages/coding-agent/src/core/completion/"
    - "packages/execution-service/src/query-handler.ts"
    - "packages/web-server/src/read-model-routes.ts"
    - "reports/p44-*/"
    - "reports/accp/P44/"
    - "docs/pi/p44/"
    - "docs/P44_*"
  excluded_paths:
    - "node_modules/"
    - ".git/objects/"

search_method:
  primary: "git_history_and_runtime_state_cross_reference"
  methods_applied:

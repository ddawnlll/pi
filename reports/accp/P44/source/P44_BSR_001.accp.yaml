dashboard_vs_runtime_comparison:
  dashboard_status_source: "plan-summary.json passed field and journal terminal events"
  dashboard_reported_status: "complete"
  runtime_status: "complete"
  git_commit_status: "partial (9/15 workspaces committed)"
  dashboard_complete_definition: "All workspaces reached terminal state (COMPLETE/FAILED/BLOCKED/CANCELLED)"
  dashboard_missing_verification:
    - "Git commit existence"
    - "File presence on disk"
    - "Write-set integrity"
    - "Test pass/fail status"
    - "npm run check results"
  mismatch: true
  mismatch_detail: >
    Dashboard says complete because plan-summary.json says passed=true
    and all 15 workspaces reached COMPLETE state. Git history shows only
    9/15 workspaces have dedicated commits. 24+ files exist untracked on
    disk. 3 claimed files don't exist. The dashboard's definition of
    'complete' does not include git commit durability.

suspected_root_causes:
  - id: "RC001"
    title: "AutoCommit capability-filter silently drops files outside canEdit"
    description: >
      AutoCommit.commit() filters changed files against workspace canEdit
      patterns. When an agent writes files outside its declared canEdit set
      (or when the canEdit patterns use different path conventions than git
      status output), those files are silently excluded. The commit then
      has zero files, returns 'No files to commit', and the failure is
      swallowed as a warning. This is the most likely cause for all 6
      workspaces without dedicated commits.
    code_path: "packages/coding-agent/src/core/auto-commit.ts:128-136"
    fix_priority: "P0"

  - id: "RC002"
    title: "Commit failures are non-escalating"
    description: >
      commitWorkspace() in autonomous-executor.ts catches all commit
      errors and logs them as warnings. There is no retry, no escalation
      to plan status, and no effect on workspace completion state. A
      workspace is COMPLETE regardless of whether its files were committed.
    code_path: "packages/coding-agent/src/core/autonomous-executor.ts:1664-1671"
    fix_priority: "P0"

  - id: "RC003"
    title: "Dashboard completeness definition mismatch"
    description: >
      The dashboard uses plan-summary.json and journal events to compute
      completion status. Neither source verifies git commit existence.
      The plan-summary.json 'passed' field is set when all workspaces
      reach terminal state. Journal events only check for presence of
      workspace_completed events. No source checks whether git commits
      were actually created.
    code_path: "packages/execution-service/src/query-handler.ts:415-478, 843-943"
    fix_priority: "P1"

  - id: "RC004"
    title: "Git reset operations during P44 execution may have affected commit state"
    description: >
      Reflog shows 4 'reset: moving to HEAD' operations during P44
      execution. If these resets were running with --hard, they would
      discard unstaged/uncommitted changes. If they ran --mixed or --soft,
      they could affect the staging area. The source of these resets needs
      investigation.
    evidence_ref: "BG010"
    fix_priority: "P2"

  - id: "RC005"
    title: "Plan-summary self-reports completion without verification"
    description: >
      The plan-summary.json summary field is written by the execution
      framework based on the LLM's output text, not based on verified
      post-conditions. The claim that 'all work was committed' is a
      textual claim from the agent, not a verified fact.
    fix_priority: "P2"

prioritized_fix_plan:
  items:
    - priority: "P0"
      id: "FP001"
      title: "Commit remaining untracked P44 files"
      description: >
        There are 24+ untracked P44 files that need to be committed to
        preserve the work. This is an immediate data-loss prevention step.
      affected_paths:
        - "docs/pi/p44/*"
        - "packages/coding-agent/src/core/completion/completion-gate-v2.ts"
        - "packages/coding-agent/src/core/completion/completion-gate-result.ts"
        - "packages/coding-agent/src/core/completion/completion-gate-adapter.ts"
        - "packages/coding-agent/src/core/completion/index.ts"
        - "packages/coding-agent/src/core/completion/p45-bridge-exporter.ts"
        - "packages/coding-agent/src/core/completion/traceability-schema.ts"
        - "packages/coding-agent/test/completion/*"
        - "packages/coding-agent/test/gauntlet/*"
        - "reports/p44-*"

    - priority: "P0"
      id: "FP002"
      title: "Fix AutoCommit to surface commit failures instead of silently skipping"
      description: >
        AutoCommit.commit() should escalate commit failures (including
        'No files to commit') to the caller so they can be handled
        appropriately. The autonomous executor should either retry the
        commit, mark the workspace as needing attention, or fail the
        workspace/plan. Silent warning-log swallowing creates a false
        sense of completeness.

    - priority: "P0"
      id: "FP003"
      title: "Fix AutoCommit capability-filter to include all changed files within workspace scope"
      description: >
        The canEdit pattern matching is too restrictive. Files written by
        an agent outside its declared canEdit set are silently dropped.
        Either the canEdit patterns should be auto-extended to include all
        files the agent actually touched, or the filter should default to
        committing all changed files when the workspace has no explicit
        canEdit restrictions.

    - priority: "P1"
      id: "FP004"
      title: "Add git commit verification to dashboard completion status"
      description: >
        The dashboard/read-model should verify that workspaces with
        autoCommit=true have corresponding git commits before reporting
        the plan as complete. This could be done by checking git log for
        workspace-specific commits.

    - priority: "P1"
      id: "FP005"
      title: "Handle 3 missing files: investigate and recreate or remove from plan-summary"
      description: >
        Three files claimed in plan-summary do not exist on disk:
        worker-report-contract.test.ts, worker-report-contract.md,
        write-set-guard.ts. Either recreate them from workspace context
        or remove them from the plan-summary to avoid confusion.

    - priority: "P2"
      id: "FP006"
      title: "Investigate git reset operations in execution pipeline"
      description: >
        Determine whether 'git reset --hard' or 'git reset --mixed' is
        being called in the execution pipeline, and whether it is
        contributing to commit failures or file loss.

    - priority: "P2"
      id: "FP007"
      title: "Add commit-verification gate to plan completion"
      description: >
        The plan completion gate should include a check that all
        autoCommit-enabled workspaces have their files committed before
        allowing the plan to be marked complete.

    - priority: "P3"
      id: "FP008"
      title: "Fix suspicious execution timestamps for P44.00-P44.02"
      description: >
        Investigate why three workspaces show identical completion
        timestamps within 4ms. This may indicate a batch-complete
        code path that bypasses actual agent execution.


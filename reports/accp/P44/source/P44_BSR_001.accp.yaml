    - "git status --porcelain for untracked/modified files"
    - "Workspace report.md and packet.json reading"
    - "Execution journal audit.ndjson, decisions.ndjson, raw.log reading"
    - "Plan-summary.json analysis"
    - "AutoCommit source code review (auto-commit.ts)"
    - "AutonomousExecutor commitWorkspace() flow review"
    - "Dashboard read-model source code review (query-handler.ts)"
    - "Git reflog analysis for reset/commit patterns"
    - "On-disk file existence vs git-tracked comparison"
    - "Capability manifest pattern matching analysis"
  tools_invoked:

    rationale: "The primary question cannot be answered affirmatively. No test proves Pi can execute a large multi-plan task end-to-end against a live system. The existing tests mostly prove internal/unit/trust-boundary behavior with faux providers."
  - decision: P50 implementation is required before production promotion
    rationale: "A P50 workstream should implement a true live-server end-to-end test that executes a realistic multi-plan scenario and validates the outcome against a real database and real LLM."

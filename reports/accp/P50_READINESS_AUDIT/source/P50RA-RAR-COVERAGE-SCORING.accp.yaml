  production_reality_confidence:
    score: 1
    rationale: Without live-server e2e, real multi-plan execution, real LLM exercise, or centralized gauntlet in CI, confidence in production readiness is low.
candidate_causes:
  - cause: Historical evolution — tests were written incrementally alongside features. Each feature added its own tests without a unifying e2e framework.
  - cause: Cost avoidance — real LLM tests cost money. The project deliberately uses faux providers for CI to avoid API costs.
  - cause: Missing infrastructure — no test harness exists that starts a live server, provisions a real database, and runs a full multi-plan scenario.
  - cause: Phase separation — P45 (async assembly) and P49 (ACCP native e2e) are in-progress with stubs that were never completed.
blast_radius:
  - If Pi is deployed without live-server e2e coverage, regressions in the execution pipeline, multi-plan coordination, async assembly, and real LLM integration could go undetected.
  - The deterministic gauntlets cover many internal invariants but cannot catch issues that only manifest with real LLM behavior, real database persistence, or real server request/response cycles.
minimal_fix_scope:
  - item: Write a true e2e gate (P50) that starts a live server, connects a real agent session, submits a multi-plan task, and validates the outcome
  - item: Wire make test-full into CI on the main branch
  - item: Complete the P45 async assembly scripts (load-profile, concurrency-profile) with real execution
  - item: Run the real-agent mini-multiplan gate with real-llm mode periodically in CI
  - item: Add a centralized promotion gate that checks test coverage thresholds
  - item: Add negative failure mode tests for server/LLM/database unavailability
  - item: Generate machine-readable evidence artifacts from all gauntlet runs
decisions:

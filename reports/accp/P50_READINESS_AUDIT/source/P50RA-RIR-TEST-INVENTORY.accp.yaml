    description: Route bus tests (test/accp/route-bus.test.ts) are isolated ACCP tests, not exercised on the real runtime execution path
    severity: medium
    blocker_class: route_bus_not_on_real_runtime_path
  - id: GAP-COMPLETION-GATE-NOT-ON-REAL-RUNTIME-PATH

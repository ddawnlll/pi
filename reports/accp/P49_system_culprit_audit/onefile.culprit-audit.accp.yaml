      The PRR is a raw YAML report. The PlanSpec forbids using raw YAML as runtime
      authority. But the PRR's p50Readiness.ready=true and "P50 can begin immediately"
      narrative was propagated to "P49 complete" claims without an independent
      completion_gate_v2 verdict.

  - id: "H11"
    title: "Plan admission does not reject unverifiable or overbroad plans"
    status: "confirmed"
    responsible_area: "planspec_admission"
    severity: "high"
    culprit_weight_percent: 6
    evidence_summary: >-
      The PlanSpec's AC evidenceTypes allow ['source','unit_test','integration_test','report']
      with no required live_tui or runtime_call_site evidence. No acceptance criterion
      explicitly demands a TUI smoke trace or runtime boot invocation. 30 workspaces
      were admitted with no per-workspace live-evidence gate. The admission gate
      does not require edge-ownership ACs (e.g. "TUI-to-CompletionGate full path
      validated end-to-end").
    evidence_refs:
      - "file:docs/P49_accp_v2_native_route_bus_implementation_plan.planspec.json:acceptanceCriteria[*].evidenceTypes"
      - "command:RG-evidenceTypes"
    files_inspected:
      - "docs/P49_accp_v2_native_route_bus_implementation_plan.planspec.json"
    commands_used:
      - "RG-evidenceTypes"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      ACs at workspace level use evidenceTypes that admit source and unit tests as
      sufficient. A pre-execution linter that required runtime_call_site and live_tui
      evidence types for any AC touching runtime behavior would have rejected the
      plan until such ACs were added.

  - id: "H12"
    title: "AllowedFiles prevented required wiring edits"
    status: "confirmed"
    responsible_area: "planspec_admission"
    severity: "high"
    culprit_weight_percent: 8
    evidence_summary: >-
      PlanSpec has 30 workspaces. None of the 30 allowedFiles blocks include
      `packages/worker-adapters/src/local-pi-worker-adapter.ts` or
      `packages/coding-agent/src/core/accp-gate-stage-runner.ts`. P49.18 owns
      `packages/coding-agent/src/core/completion-gate.ts` (root core/) but not
      `packages/coding-agent/src/core/completion/completion-gate-vnext-types.ts`
      (the file where STAGE_ORDER is declared). P49.17 owns autonomous-executor.ts
      but cannot edit the worker adapter that produces the accp field it reads.
    evidence_refs:
      - "command:RG-local-pi-worker-adapter|accp-gate-stage-runner|in-planspec"
      - "file:docs/P49_accp_v2_native_route_bus_implementation_plan.planspec.json:3429"
    files_inspected:
      - "docs/P49_accp_v2_native_route_bus_implementation_plan.planspec.json"
    commands_used:
      - "RG-allowedFiles-p49"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      Two production-critical files (LocalPiWorkerAdapter, AccpGateStageRunner) have
      no owning workspace. One production-critical file
      (completion-gate-vnext-types.ts containing STAGE_ORDER) is misassigned to a
      workspace that owns a different file path. No agent could have written the
      missing wiring without first modifying allowedFiles — which is itself a
      PlanSpec mutation requiring its own gate.

  - id: "H13"
    title: "Workspace decomposition caused ownership loss"
    status: "confirmed"
    responsible_area: "planspec_admission"
    severity: "medium_high"
    culprit_weight_percent: 4
    evidence_summary: >-
      30 workspaces across 8 waves, each with allowedFiles scoped to a narrow
      module or single file. No workspace owns the end-to-end runtime edge
      (TUI Tab → showAccpModePicker → InitialRouteIndicator → AccpTaskEnvelope →
      AgentSession → autonomous-executor → compileAccpSource → AccpArtifactStore →
      CompletionGateV2 AccpGate). The PRR claims 'All gating criteria for P50
      start are met' but the workspace reports are bounded to their own files and
      cannot validate the full path.
    evidence_refs:
      - "file:docs/P49_accp_v2_native_route_bus_implementation_plan.planspec.json:933-end"
      - "command:RG-workspace-ids"
    files_inspected:
      - "docs/P49_accp_v2_native_route_bus_implementation_plan.planspec.json"
    commands_used:
      - "RG-workspace-ids"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      Decomposition optimizes for parallel implementation but not for cross-component
      validation. Each workspace TVR passes by unit-testing its own files. The
      missing AC — "TUI Tab invokes ACCP gate in production" — has no workspace owner.

  - id: "H14"
    title: "ExecutionKernel acted as pass-through runner"
    status: "confirmed"
    responsible_area: "runtime_completion_gate"
    severity: "critical"
    culprit_weight_percent: 0
    evidence_summary: >-
      planCompletionPredicate (execution-runtime/plan-supervisor.ts) is a 9-line
      function that takes workspace states and returns a stage. It has zero
      awareness of ACCP gate verdict, compiled artifacts, route signals, or
      the worker adapter accp field. The kernel is the authority owner per
      PlanSpec but does not recompute any evidence score; it accepts whatever
      the worker/PRR claim provides and reduces it to a stage.
    evidence_refs:
      - "file:packages/coding-agent/src/execution-runtime/plan-supervisor.ts"
    files_inspected:
      - "packages/coding-agent/src/execution-runtime/plan-supervisor.ts"
      - "packages/coding-agent/src/execution-runtime/completion-predicate.ts"
    commands_used:
      - "READ-plan-supervisor"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      planCompletionPredicate only checks: (a) any required handoff not complete →
      HANDOFF_REQUIRED, (b) any required workspace FAILED_FINAL → FAILED_FINAL,
      (c) all required SUCCEEDED → FINAL_VALIDATION. There is no branch that
      consults the ACCP gate verdict or the AccpArtifactStore. The kernel cannot
      independently detect a missing ACCP gate.

  - id: "H15"
    title: "Command validation gave false confidence"
    status: "confirmed"
    responsible_area: "command_validation"
    severity: "medium"
    culprit_weight_percent: 0
    evidence_summary: >-
      'npm run check' (biome + tsgo + browser-smoke + web-ui tsc) passes with
      exit 0. 'npm run build' (tsgo -p tsconfig.build.json + copy assets + tsc + tailwind)
      passes with exit 0. PRR cites 'typeCheckPassed: true' and 'compilerTestsTotal: 226'
      as evidence of completion. These are necessary but insufficient: they do
      not exercise the runtime boot path, TUI live Tab, or production call sites
      of runAccpGateStage / getAccpRouteBus / AccpArtifactStore.
    evidence_refs:
      - "command:VALIDATE_NPM_CHECK:exit_code=0"
      - "command:VALIDATE_NPM_BUILD:exit_code=0"
    files_inspected:
      - "package.json"
    commands_used:
      - "VALIDATE_NPM_CHECK"
      - "VALIDATE_NPM_BUILD"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      The PlanSpec's exactAllowedCommands include CMD-TYPECHECK-TSGO and
      CMD-ACCP-COMPILER-UNIT but no live-TUI smoke command for ACCP gate
      invocation. Wave TVRs cite only the typecheck and unit-test commands.
      Build success is treated as runtime readiness by the PRR narrative.

  - id: "H16"
    title: "Write/edit tool silently failed"
    status: "rejected"
    responsible_area: "write_edit_tooling"
    severity: "low"
    culprit_weight_percent: 4
    evidence_summary: >-
      Direct source inspection of packages/coding-agent/src/core/mutation/atomic-file-writer.ts
      shows temp-write + rename + read-back postHash verify pattern. The empty
      catch{} on line 135 is for tempfile cleanup (safe). P49_codeloss_rca
      probed with `node -e` direct write to reports/accp/P49_codeloss_rca/probes/
      and `git diff --stat` showed the untracked dir, confirming disk mutation.
      The 49 files / 3307 insertions in current `git status --short` are
      tangible evidence that writes reached disk. No silent success-without-mutation
      pattern found in write.ts, edit.ts, or mutation/.
    evidence_refs:
      - "file:packages/coding-agent/src/core/mutation/atomic-file-writer.ts:114-140"
      - "file:reports/accp/P49_codeloss_rca/onefile.accp.yaml:PROBE_TOOL_IMPLEMENTATION_SCAN"
      - "command:git status --short (49 modified files)"
    files_inspected:
      - "packages/coding-agent/src/core/mutation/atomic-file-writer.ts"
      - "packages/coding-agent/src/core/tools/write.ts"
      - "packages/coding-agent/src/core/tools/edit.ts"
    commands_used:
      - "READ-atomic-file-writer"
    fix_required_before_p49_repair: false
    exact_failure_mode: >-
      atomicWriteFile uses write-to-temp + rename + read-back-verify pattern.
      Returns {success: true, postHash} on success. No silent failure pattern.

  - id: "H17"
    title: "Worktree diff was lost before integration"
    status: "rejected"
    responsible_area: "worktree_integration"
    severity: "medium"
    culprit_weight_percent: 2
    evidence_summary: >-
      git status --short shows 49 modified files in working tree including
      packages/coding-agent/src/core/{accp-route-bus,accp-artifact-store,
      agent-session,index,keybindings,accp-prompt-renderer,accp-repair-controller}.ts,
      packages/coding-agent/src/modes/interactive/interactive-mode.ts, and the
      new packages/accp-compiler. The .pi/execution-journal.ndjson shows 19,981+
      workspace_start/workspace_complete events with file_lock_acquired/released
      pairs. Recent commits include 065ebce1b (P49.30), dcbc570d1 (P49.26),
      cffa7eb57 (P49.29). The diff reached the working tree; the gap is that
      the production wiring (STAGE_ORDER, LocalPiWorkerAdapter, Tab activation)
      was never written into those diffs.
    evidence_refs:
      - "command:git status --short"
      - "command:git log --oneline -5"
      - "command:tail .pi/execution-journal.ndjson"
    files_inspected:
      - ".pi/execution-journal.ndjson"
    commands_used:
      - "READ-journal"
    fix_required_before_p49_repair: false
    exact_failure_mode: >-
      No diff loss detected. The integration gap is in the diff content (production
      wiring was never written), not in the diff transport.

  - id: "H18"
    title: "Completion gate error observability is insufficient"
    status: "inconclusive"
    responsible_area: "observability"
    severity: "high"
    culprit_weight_percent: 4
    evidence_summary: >-
      terminal-reconciler.ts exists and writes blockReasons into
      completionGateBlockReasons (autonomous-executor.ts line 1674). The
      runAccpGateStage returns StageVerdict with blockReasons and warnings.
      However, because AccpGate is not in STAGE_ORDER, the ACCP gate block
      reasons are never produced at all — the gate is silent by absence.
      Live TUI smoke (P0_1) reports user-visible behavior is unverified,
      which is the worst kind of observability: no false signal. The
      question of whether error messages are *machine-readable* when the
      gate does fire cannot be answered from the audit context, since the
      gate is never exercised in production.
    evidence_refs:
      - "file:packages/coding-agent/src/core/completion/terminal-reconciler.ts"
      - "file:packages/coding-agent/src/core/autonomous-executor.ts:1662-1724"
      - "file:reports/tmp/gate-sanity/P0_1/tui/smoke-result.json"
    files_inspected:
      - "packages/coding-agent/src/core/completion/terminal-reconciler.ts"
      - "packages/coding-agent/src/core/autonomous-executor.ts"
    commands_used:
      - "READ-reconciler"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      When the AccpGate stage is missing from STAGE_ORDER, the orchestrator
      produces zero blockReasons from ACCP. The terminal reconciler has
      nothing to surface. The absence is the bug, not the message format.

  - id: "H19"
    title: "Evidence ledger exists but is not linked end-to-end"
    status: "confirmed"
    responsible_area: "evidence_engine"
    severity: "critical"
    culprit_weight_percent: 0
    evidence_summary: >-
      TVR reports (e.g., reports/accp/P49/tvr_wave_W1.accp.yaml) cite
      command_results with executable + exit_code + output_excerpt but no
      sha256 hash of the produced artifact, no file_path to the produced
      compiled JSON, and no command_id that resolves to a recorded run in
      the execution journal. The PRR cites 'compilerTestsPassed: 226' as
      a single number without per-test sha or report_id mapping. The P49
      truth audit onefile.evidence.json does carry hashes for some evidence
      (e.g., 'sha256: b4b76765e1d25e7a093139b9399b21b6f47a1d0d83bb97d02841856efec77d46'
      for tui_smoke), but the PRR does not consume them.
    evidence_refs:
      - "file:reports/accp/P49/tvr_wave_W1.accp.yaml:command_results"
      - "file:reports/accp/P49_runtime_truth_audit_after_kernel/evidence/onefile.evidence.json"
    files_inspected:
      - "reports/accp/P49/tvr_wave_W1.accp.yaml"
    commands_used:
      - "READ-TVR"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      No evidence_ref in the TVRs or PRR carries a sha256 hash of a compiled
      JSON artifact or a route-signal.json. The evidence ledger is a textual
      count, not a hash-anchored chain.

  - id: "H20"
    title: "P0.1 validates harness readiness but not P49-specific wiring"
    status: "confirmed"
    responsible_area: "observability"
    severity: "high"
    culprit_weight_percent: 2
    evidence_summary: >-
      P0 scorecard (reports/accp/gate-sanity/P0/scorecard.json) reports
      kernel_sanity.verdict = 'PASS', all_negative_controls_blocked = true,
      promotion_allowed = false. P0_1 evidence (reports/accp/gate-sanity/P0_1/evidence/onefile.evidence.json)
      reports p0_rerun.verdict = 'PASS' and tui_smoke.status = 'blocked' with
      the explicit statement "Tab does NOT open accp-mode-picker overlay in the
      live TUI editor". The harness readiness check passed (false-positive
      negative controls are correctly blocked) but the live TUI Tab did not
      open the picker. P0 is a harness gate, not a P49 feature gate.
    evidence_refs:
      - "file:reports/accp/gate-sanity/P0/scorecard.json"
      - "file:reports/accp/gate-sanity/P0_1/evidence/onefile.evidence.json"
      - "file:reports/tmp/gate-sanity/P0_1/tui/smoke-result.json"
    files_inspected:
      - "reports/accp/gate-sanity/P0/scorecard.json"
      - "reports/accp/gate-sanity/P0_1/evidence/onefile.evidence.json"
      - "reports/tmp/gate-sanity/P0_1/tui/smoke-result.json"
    commands_used:
      - "READ-P0-scorecard"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      P0 PASS means 'the harness can produce false-positive signals and they
      are correctly blocked' — i.e., the meta-harness works. It does not
      mean 'P49 runtime wiring is complete'. P49 needs its own feature
      scorecard with live_TUI_accp_picker_opened, accp_gate_in_STAGE_ORDER,
      worker_adapter_sets_accp, route_bus_instantiated_in_production,
      artifact_store_consumed_in_completion_gate — none of which exist.

system_culpability_breakdown:
  runtime_completion_gate:
    percent: 36
    rationale: >-
      STAGE_ORDER omission (H1/H2), runAccpGateStage never registered (H3),
      planCompletionPredicate has no ACCP branch (H14), raw YAML/operator_approval
      treated as authority (H10). This is the single largest cause: a gate that
      should have blocked P49 completion was never scheduled.
  evidence_engine:
    percent: 22
    rationale: >-
      PRR (H4) credits source presence and unit-test counts as runtime completion;
      evidence ledger (H19) cites test counts not hash-anchored artifacts.
      H4 alone is responsible for the "P50 can begin" claim that propagated to
      "P49 complete" without an independent runtime verification.
  worker_adapter_bridge:
    percent: 12
    rationale: >-
      H5 — LocalPiWorkerAdapter never populates accp field. The entire ACCP
      compile pipeline (worker→executor→compile→artifact→gate) collapses
      at the first link. Without this fix, none of the downstream links
      can be exercised.
  planspec_admission_and_decomposition:
    percent: 18
    rationale: >-
      H11 (no live_TUI evidence type), H12 (allowedFiles gaps for
      local-pi-worker-adapter.ts and accp-gate-stage-runner.ts), H13
      (no end-to-end owner). The plan admitted 30 narrow workspaces
      that each closed a unit-test loop but could not validate the
      production edge. Plan problem estimate: 18% (see planspec_findings).
  model_agent_behavior:
    percent: 0
    rationale: >-
      The agent followed instructions within its allowedFiles. It wrote
      valid TypeScript, passed unit tests, and produced wave TVRs. The
      false completion is not a model error — it is a consequence of
      the plan's evidence rules and the gate's wiring. Per scoring
      rules, model/agent must not exceed runtime/gate responsibility
      when runtime/gate correctly rejected claims (it did not reject).
  write_edit_tooling:
    percent: 4
    rationale: >-
      H16 rejected (write path works). Remaining 4% reflects that
      agent-side prompt-instruction interpretations ('a passing PRR
      is enough') were not contradicted by tooling, but this is a
      minor factor and capped at <=10 by scoring rules.
  worktree_integration:
    percent: 2
    rationale: >-
      H17 rejected. Diff is present in working tree (49 files / 3307
      insertions). 2% reflects that integration did not trigger a
      cross-component regression test that would have caught the
      wiring gap.
  command_validation:
    percent: 4
    rationale: >-
      H15 confirmed. 'npm run check' and 'npm run build' pass; PRR
      cites them as evidence. They are necessary but not sufficient.
      No live TUI smoke or runtime boot trace is required by the
      command policy.
  observability:
    percent: 2
    rationale: >-
      H18 inconclusive. The ACCP gate's silence-by-absence is the
      observability gap. H20 confirmed: P0.1 PASS does not validate
      P49. Observability's main role is that the false completion was
      not detected by any automated check that did not require manual
      cross-component reasoning.
  total_percent: 100

component_findings:
  completion_gate:
    status: "fail"
    findings:
      - "STAGE_ORDER in completion-gate-vnext-types.ts omits AccpGate; orchestrator never reaches it."
      - "StageRunnerRegistry defaults to empty; no production file registers runAccpGateStage."
      - "planCompletionPredicate has no ACCP gate awareness; kernel cannot detect missing gate."
      - "CompletionGateV2 is a wrapper around completion-gate.ts and adds PlanSpec-mode checks (lock hashes, worker echo) but not ACCP."
    required_fix:
      - "Add 'AccpGate' to STAGE_ORDER (after EvidenceLedger)."
      - "Register runAccpGateStage in default or production registry."
      - "Wire planCompletionPredicate to consult AccpGateVerdict when present."
      - "Add per-workspace live/runtime call-site evidence requirement to CompletionGateV2."
  evidence_engine:
    status: "fail"
    findings:
      - "PRR credits source presence (>=0.25) and unit tests (0.75) as completion; no live/TUI evidence requirement."
      - "P49 PRR p50Readiness.ready=true despite 62.35% missing wiring (R005/R007/R008/R010/R011 etc.)."
      - "TVRs cite unit-test command_results without sha256 or artifact_path to compiled JSON."
    required_fix:
      - "Add credit rubric rung 'live_runtime_verified = 1.0' and require it for any AC touching user-visible runtime."
      - "Add 'live_tui' and 'runtime_call_site' to AC evidenceTypes options."
      - "Hash-anchor every TVR command result to the produced compiled/verdict/route artifact."
  worker_adapter:
    status: "fail"
    findings:
      - "LocalPiWorkerAdapter.run() returns {verdict, events:[], changedFiles:[], commandHistory:[], report, error, metadata} — no accp field."
      - "Adapter does not import AccpWorkerOutput."
      - "autonomous-executor.ts line 1273 reads workerResult.accp?.shouldCompile which is always undefined."
      - "contextUsed is placed in metadata (an extra nesting) rather than as a direct WorkerRunResult property."
    required_fix:
      - "Import AccpWorkerOutput type in local-pi-worker-adapter.ts."
      - "Populate workerResult.accp from executor.execute() output or post-execution compile step."
      - "Wire changedFiles/events/commandHistory from agentResult instead of hardcoding empty arrays."
      - "Move contextUsed out of metadata to top-level property."
  tui_runtime:
    status: "fail"
    findings:
      - "accpModePickerEnabled never set to true in any production caller."
      - "Tab keybinding block is guarded by if (this.options.accpModePickerEnabled)."
      - "showAccpModePicker is the only caller of createInitialRouteIndicator and createAccpTaskEnvelope."
      - "P0_1 TUI smoke captured a live Tab keypress and confirmed picker did not open."
    required_fix:
      - "Set accpModePickerEnabled = true in InteractiveMode boot path (TUI new-session)."
      - "Or expose a setting/flag that user can toggle to enable the picker."
      - "Add a live_TUI smoke test that asserts the picker overlay appears on Tab and emits InitialRouteIndicator."
  route_bus:
    status: "fail"
    findings:
      - "AccpRouteBus class exists; getAccpRouteBus() lazy singleton exists."
      - "Zero non-test call sites of getAccpRouteBus()."
      - "createDefaultSubscriptions(bus, publish) is only imported by tests."
    required_fix:
      - "Call getAccpRouteBus() in agent-session boot or in a designated runtime singleton initialization step."
      - "Wire createDefaultSubscriptions(bus, publish) into a boot module that subscribes ACCP consumers."
  artifact_store:
    status: "fail"
    findings:
      - "AccpArtifactStore saveCompiled/readCompiled/saveRouteSignal/readRouteSignal exist."
      - "Zero non-test call sites."
      - "ACCP compiler writes compiled output directly to disk, bypassing the store."
    required_fix:
      - "Wire AccpArtifactStore instance into compiler bridge (saveCompiled)."
      - "Wire readVerdict/readRouteSignal into CompletionGateVNext AccpGate stage."
      - "Single AccpArtifactStore instance per plan execution."
  planspec_admission:
    status: "fail"
    findings:
      - "30 workspaces with allowedFiles scoped to narrow file lists; no workspace owns local-pi-worker-adapter.ts or accp-gate-stage-runner.ts."
      - "P49.18 owns completion-gate.ts (root core/) but not completion/completion-gate-vnext-types.ts (where STAGE_ORDER is declared)."
      - "AC evidenceTypes lack 'live_tui' and 'runtime_call_site'."
      - "No per-workspace edge-ownership AC for the end-to-end runtime path."
    required_fix:
      - "Add a new workspace or extend P49.18 with allowedFiles covering completion/completion-gate-vnext-types.ts."
      - "Add allowedFiles for local-pi-worker-adapter.ts to a new or extended P49.17/P49.18."
      - "Add 'live_tui' and 'runtime_call_site' to evidenceTypes and require at least one for runtime ACs."
      - "Add a cross-component AC: 'TUI Tab invokes ACCP gate in production path' with explicit owner."
  write_edit_tools:
    status: "pass"
    findings:
      - "atomicWriteFile uses temp+rename+postHash verify; no silent success pattern."
      - "Direct FS write probe in P49_codeloss_rca confirmed disk mutation; 49 files / 3307 insertions in git status."
    required_fix:
      - "No fix required for write/edit tools."

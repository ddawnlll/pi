final_decision:
  culprit_audit_status: "complete"
  p49_repair_should_start: "conditional"
  evidence_engine_required_before_repair: true
  completion_gate_hardening_required_before_repair: true
  top_10_required_fixes_in_order:
    - order: 1
      fix: >-
        Add 'AccpGate' to STAGE_ORDER in completion-gate-vnext-types.ts and register
        runAccpGateStage in the production StageRunnerRegistry. Default registry must
        include AccpGate; verify with a unit test that iterates STAGE_ORDER.
      responsible_component: "completion-gate-vnext"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "CompletionGate vNext can never evaluate ACCP; H1/H2/H3 will remain confirmed."
    - order: 2
      fix: >-
        Wire planCompletionPredicate / isPlanComplete to consult AccpGateVerdict
        (when present) and require it for any plan with required ACCP mode.
      responsible_component: "execution-runtime/plan-supervisor"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "ExecutionKernel will continue to accept worker/PRR claims without an ACCP gate cross-check."
    - order: 3
      fix: >-
        Populate WorkerRunResult.accp in LocalPiWorkerAdapter.run(). Import
        AccpWorkerOutput, derive accp from executor.execute() output or
        post-execution compile, and return it on the result. Also populate
        changedFiles/events/commandHistory from agentResult rather than empty
        arrays.
      responsible_component: "worker-adapters/local-pi-worker-adapter"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "autonomous-executor ACCP compile path will remain permanently disabled."
    - order: 4
      fix: >-
        Add allowedFiles for packages/worker-adapters/src/local-pi-worker-adapter.ts
        to P49.18 (or a new P49.31) so that the worker adapter wiring has an
        owner. Same for accp-gate-stage-runner.ts.
      responsible_component: "planspec-admission"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "Future P49 repair agents will continue to be unable to touch the missing files."
    - order: 5
      fix: >-
        Add allowedFiles for packages/coding-agent/src/core/completion/completion-gate-vnext-types.ts
        to P49.18 so that STAGE_ORDER modifications have a workspace owner. P49.18 currently
        owns only the root completion-gate.ts.
      responsible_component: "planspec-admission"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "The file with STAGE_ORDER has no workspace owner."
    - order: 6
      fix: >-
        Set accpModePickerEnabled = true in the InteractiveMode boot path, or expose
        a setting/flag that the user can toggle. Add a live TUI smoke test that
        asserts the picker overlay appears on Tab and that InitialRouteIndicator +
        AccpTaskEnvelope are emitted.
      responsible_component: "interactive-mode"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "TUI mode picker remains dead code; user cannot select ACCP mode at runtime."
    - order: 7
      fix: >-
        Wire AccpRouteBus boot: call getAccpRouteBus() once at agent-session
        initialization, call createDefaultSubscriptions(bus, publish) to wire
        consumer subscriptions.
      responsible_component: "accp-route-bus + agent-session"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "Route bus remains structurally present but functionally inert."
    - order: 8
      fix: >-
        Wire AccpArtifactStore: compiler bridge calls saveCompiled; CompletionGateVNext
        AccpGate stage calls readVerdict / readRouteSignal. Single AccpArtifactStore
        instance per plan execution.
      responsible_component: "accp-artifact-store + completion-gate-vnext"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "Compiled JSON artifacts are never persisted through the artifact store; gate verdict is never read."
    - order: 9
      fix: >-
        Add a P49 feature scorecard with required credit rung
        'live_runtime_verified = 1.0'. Add 'live_tui' and 'runtime_call_site'
        to AC evidenceTypes and require at least one for any AC touching
        runtime/user-visible behavior. PRR must not declare p50Readiness.ready
        while any required AC lacks live_runtime_verified credit.
      responsible_component: "evidence-engine + planspec-admission"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "Source-presence and unit-test-only claims will continue to be treated as runtime completion."
    - order: 10
      fix: >-
        Hash-anchor every TVR command result to the produced compiled/verdict/route
        artifact. Each TVR evidence block must include sha256 + artifact_path.
        P49 truth-audit onefile.evidence.json already carries some hashes; the
        PRR must consume them rather than only test counts.
      responsible_component: "evidence-engine + tvr-template"
      blocks_p49_repair: true
      hard_stop_if_ignored:
        - "Evidence ledger will remain a textual count, not a hash-anchored chain."


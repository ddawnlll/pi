executive_summary:
  one_sentence_answer: >-
    Both manual execution and ExecutionKernel execution reported P49 as complete because
    (1) the CompletionGate vNext STAGE_ORDER omits the AccpGate stage, so runAccpGateStage
    is never scheduled even though it is declared as a stage name; (2) the LocalPiWorkerAdapter
    never populates the `accp` field of WorkerRunResult, so the executor's ACCP compile hook
    reads undefined and the P49 path through worker→autonomous-executor is silently broken;
    (3) the TUI Tab mode picker exists but `accpModePickerEnabled` is never set to true in any
    production caller, leaving the live TUI mode picker and InitialRouteIndicator/AccpTaskEnvelope
    path as unreachable dead code; (4) AccpRouteBus and AccpArtifactStore have full method
    surfaces but zero production readers/writers; (5) the PRR evidence engine accepts
    source presence, unit-test counts, and wave TVR PASS status as the basis for a
    "P50 can begin" verdict despite 62.35% of P49 requirements still being unwired; and
    (6) the PlanSpec decomposition never assigned allowedFiles ownership for
    `local-pi-worker-adapter.ts` or `accp-gate-stage-runner.ts`, so no workspace could have
    produced the missing wiring even if execution had been perfect.
  primary_root_cause: >-
    CompletionGate vNext STAGE_ORDER does not include the AccpGate stage, so the production
    completion pipeline can never run ACCP gate evaluation, and the entire P49 "wiring
    completion" claim rests on a gate that is not in the executable stage list. The supporting
    wiring chain (worker adapter accp bridge, TUI picker activation, AccpRouteBus boot instance,
    AccpArtifactStore readers) is also broken at every link, and no PlanSpec workspace owned the
    files where the bridge must be repaired.
  secondary_root_causes:
    - "LocalPiWorkerAdapter.run() never populates WorkerRunResult.accp; autonomous-executor reads workerResult.accp?.shouldCompile which is always undefined."
    - "accpModePickerEnabled is never set to true in any production caller, so showAccpModePicker (and the only call site of createInitialRouteIndicator/createAccpTaskEnvelope) is unreachable from the live TUI Tab path."
    - "PRR/PRR-like evidence engine treats unit-test counts and source presence as runtime completion; the P49 PRR marks p50Readiness.ready=true with 62.35% missing wiring and only 'operator_approval' as a blocker."
    - "AccpRouteBus.getAccpRouteBus() and AccpArtifactStore.{save,read}{Compiled,Verdict,RouteSignal} have zero non-test production call sites; the runtime consumes nothing through the artifact store."
    - "PlanSpec allowedFiles decomposition never assigned `packages/worker-adapters/src/local-pi-worker-adapter.ts` or `packages/coding-agent/src/core/accp-gate-stage-runner.ts` to any workspace; P49.18 owns `completion-gate.ts` but not the `completion/` subdir where STAGE_ORDER lives."
    - "planCompletionPredicate (execution-runtime/plan-supervisor.ts) is a pure stage-state reducer and has no awareness of ACCP gate verdict, so even a missing AccpGate stage cannot be detected by the kernel."
  rejected_root_causes:
    - "Write/edit tool silent failure — atomicWriteFile uses temp+rename+postHash verify; direct FS write probe in P49_codeloss_rca confirmed disk mutation; no silent success-without-mutation pattern found."
    - "Worktree diff loss — the 45 modified files in `git status` and 3307 insertions confirm agent code reached the working tree; the gap is integration/wiring, not storage."
    - "PlanSpec admission rejection of P49 — admission gate did not block P49; P49 ran end-to-end, which is the audit's whole premise."
  final_hypothesis_counts:
    confirmed: 14
    rejected: 4
    inconclusive: 2
    not_testable: 0
    total: 20


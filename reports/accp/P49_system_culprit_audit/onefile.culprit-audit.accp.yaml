hypotheses:
  - id: "H1"
    title: "CompletionGate false-positive accepted P49 completion"
    status: "confirmed"
    responsible_area: "runtime_completion_gate"
    severity: "critical"
    culprit_weight_percent: 22
    evidence_summary: >-
      CompletionGate vNext iterates STAGE_ORDER (9 stages). AccpGate is declared as a
      CompletionGateStageName type member but excluded from STAGE_ORDER, so the orchestrator
      never schedules it. runAccpGateStage is defined and unit-tested, but CompletionGateVNext
      cannot call it. The planCompletionPredicate in execution-runtime/plan-supervisor.ts is a
      pure stage-state reducer with no ACCP awareness, so the kernel never recomputes the ACCP
      verdict. All of P49's "completion" rests on a gate that is not in the executable stage list.
    evidence_refs:
      - "file:packages/coding-agent/src/core/completion/completion-gate-vnext-types.ts:sha256:950b189c9d97bbf187b797ed46226262645eb3c36bf4c9a4bbd12451a6650004"
      - "file:packages/coding-agent/src/core/completion/completion-gate-vnext.ts"
      - "file:packages/coding-agent/src/execution-runtime/plan-supervisor.ts"
      - "command:RG-STAGE-ORDER"
      - "report:reports/accp/P49_runtime_truth_audit_after_kernel/scorecard.json"
    files_inspected:
      - "packages/coding-agent/src/core/completion/completion-gate-vnext-types.ts"
      - "packages/coding-agent/src/core/completion/completion-gate-vnext.ts"
      - "packages/coding-agent/src/execution-runtime/plan-supervisor.ts"
    commands_used:
      - "RG-STAGE-ORDER"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      STAGE_ORDER in completion-gate-vnext-types.ts lists 9 stages
      (DeclaredOutputExistence, EvidenceLedger, Validation, ScopeAndWriteSet, CommitCandidate,
      CommitExecution, PostCommitVerification, CommitMessageComposer, DestructiveOperationGuard);
      AccpGate is in the type union but absent from the array. Orchestrator iteration of
      STAGE_ORDER therefore never reaches AccpGate, and unregistered stages are skipped with
      a warning (not blocked). planCompletionPredicate has no ACCP branch.

  - id: "H2"
    title: "AccpGate registered in type but absent from STAGE_ORDER"
    status: "confirmed"
    responsible_area: "runtime_completion_gate"
    severity: "critical"
    culprit_weight_percent: 0
    evidence_summary: >-
      Direct source inspection. CompletionGateStageName union includes 'AccpGate';
      STAGE_ORDER readonly array does not. This is the precise structural defect.
    evidence_refs:
      - "file:packages/coding-agent/src/core/completion/completion-gate-vnext-types.ts:50-65"
    files_inspected:
      - "packages/coding-agent/src/core/completion/completion-gate-vnext-types.ts"
    commands_used:
      - "RG-STAGE-ORDER"
    fix_required_before_p49_repair: true
    exact_failure_mode: >-
      STAGE_ORDER array literal at line ~58 explicitly omits 'AccpGate'. Even if a runner were
      registered for AccpGate, the orchestrator's `for (const stageName of STAGE_ORDER)` loop
      would never invoke it.


held_gates:
  - gate: "IVG-005-LIVE-TUI-PICKER"
    reason: >
      The live TUI smoke test (scripts/p0-tui-smoke.mjs) exercises the bare
      editor component in isolation and does not instantiate InteractiveMode,
      which is where the Tab keybinding for `app.accp.modePicker` is registered.
      Static source analysis confirms:
      - accpModePickerEnabled defaults true in InteractiveMode constructor
      - defaultEditor.onAction("app.accp.modePicker", showAccpModePicker) is wired
      - showAccpModePicker calls createInitialRouteIndicator + createAccpTaskEnvelope
      But live emission evidence requires a full InteractiveMode boot path test
      that the current smoke infrastructure does not provide. This is a testing
      gap, not a missing wiring. Fix requires enhancing p0:tui-smoke to launch
      the full InteractiveMode or adding a dedicated TUI integration test.
  - gate: "IVG-006-LIVE-ROUTE-EMISSION"
    reason: >
      Same root cause as IVG-005. InitialRouteIndicator and AccpTaskEnvelope
      factory call sites are present and wired through showAccpModePicker, but
      the live event trace from a full InteractiveMode session is not captured
      by the current smoke harness. The event trace in reports/tmp/gate-sanity/P0_1/tui/
      shows only raw input events (sendInput), not application-level action
      dispatches like app.accp.modePicker.


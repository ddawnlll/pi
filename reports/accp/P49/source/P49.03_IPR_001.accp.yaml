    - decision: Route signals have isAdvisory: true as a type invariant
      rationale: "Architectural guard — route signals do not authorize execution."
    - decision: AccpLifecycleEvent is a discriminated union with 5 kinds
      rationale: "Structured event types for the event journal."
  accp_mode_behavior: "off — this workspace creates type/contract infrastructure only, no runtime ACCP behavior"

changes:
  - file: packages/execution-contracts/src/accp-types.ts
    action: create
    summary: >
      Core ACCP v2.0 type definitions. Includes AccpReportType (24-report union),
      AccpReportFamily, AccpSupportLevel, AccpMode, AccpCompileStatus, AccpDiagnostic,
      AccpCompileResult, AccpRouteSignal, AccpGateVerdict, AccpFinding, AccpWorkerOutput,
      AccpIntermediateRepresentation, AccpArtifactRef, InitialRouteIndicator,
      AccpTaskEnvelope. 382 lines.
  - file: packages/execution-contracts/src/accp-events.ts
    action: create
    summary: >
      ACCP lifecycle events with 5 kinds: compile_started, compile_completed,
      gate_verdict_emitted, finding_recorded, route_signal_emitted.
      Uses discriminated union pattern for type safety.
  - file: packages/execution-contracts/test/accp-types.test.ts
    action: create
    summary: >
      18 tests covering positive type assertions and 5 negative authority boundary
      tests (route signal advisory invariant, optional accp on WorkerRunResult,
      backward compat without accp, discriminated union completeness).
  - file: packages/execution-contracts/src/worker-adapter.ts
    action: edit
    summary: >
      Added optional accp?: AccpWorkerOutput field to WorkerRunResult.
      Imported AccpWorkerOutput from ./accp-types.js. Legacy report field unchanged.
  - file: packages/execution-contracts/src/index.ts
    action: edit
    summary: >
      Added type and value exports for all ACCP type system and event types.


  key_decisions:
    - decision: AccpMode is defined in accp-types.ts as the canonical type source
      rationale: "P49.03 owns the type system foundation; P49.02 imports it from here."
    - decision: AccpWorkerOutput on WorkerRunResult is optional (additive)

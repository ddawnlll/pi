    - packages/coding-agent/test/plan-compiler/accp-planspec-authority.test.ts
  modified_files:
    - packages/execution-contracts/src/index.ts (export additions)
  deleted_files: []
  key_decisions:
    - decision: PlanSpec declares ACCP authority boundaries but does NOT choose the next ACCP mode or route
      rationale: "Authority separation invariant — PlanSpec defines allowed modes, route signals are advisory, runtime authorizes execution."
    - decision: AccpMode is defined in accp-types.ts (P49.03) and imported by accp-planspec-types.ts (P49.02)
      rationale: "Canonical type source is P49.03's type system foundation; P49.02 re-exports for PlanSpec context."
    - decision: Default ACCP mode is 'warn', promotion to 'required' requires operator approval + gauntlet pass
      rationale: "P49 implementation must not unconditionally enable required mode."
  accp_mode_behavior: "off — this workspace adds PlanSpec authority contract types only, no runtime ACCP behavior"

changes:
  - file: packages/execution-contracts/src/planspec/accp-planspec-types.ts
    action: create
    summary: >
      ACCP v2.0 PlanSpec authority boundary types. Defines AccpMode, AccpModePolicy,
      AccpReportProtocol, PlanSpecAccpRequirements, PlanSpecReportRequirements,
      and PlanSpecAccpExtension. Includes defaults (DEFAULT_ACCP_EXTENSION etc.)
      with mode='warn', routeSignalsAreAdvisory=true, runtimeAuthorityRequired=true.
  - file: packages/coding-agent/test/plan-compiler/accp-planspec-authority.test.ts
    action: create
    summary: >
      16 tests covering positive type assertions and 4 negative authority boundary
      tests (no nextMode/nextRoute in PlanSpec extension, route signals do not
      authorize mutation, advisory consistency, promotion gate requirements).
  - file: packages/execution-contracts/src/index.ts
    action: edit
    summary: Added exports for AccpMode, AccpModePolicy, PlanSpecAccpExtension,
      PlanSpecAccpRequirements, PlanSpecReportRequirements, and all DEFAULT_* constants.

